services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION}
    container_name: gitlab
    restart: unless-stopped
    hostname: ${GITLAB_HOSTNAME}
    shm_size: 256m
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT}
        gitlab_rails['gitlab_ssh_host'] = '${GITLAB_SSH_HOST}'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        nginx['proxy_set_headers'] = { "X-Forwarded-Proto" => "https", "X-Forwarded-Ssl" => "on" }
        letsencrypt['enable'] = false

        # Container registry. TLS ends at the reverse proxy, like the main site.
        # The token realm is where docker clients fetch their pull/push token.
        # It defaults to the external URL, which sits behind the proxy's
        # auth gate, so it can be pointed somewhere clients can reach.
        registry_external_url 'https://${GITLAB_REGISTRY_HOSTNAME:?GITLAB_REGISTRY_HOSTNAME is not set}'
        registry['token_realm'] = '${GITLAB_REGISTRY_TOKEN_REALM:?GITLAB_REGISTRY_TOKEN_REALM is not set}'
        registry_nginx['listen_port'] = 5050
        registry_nginx['listen_https'] = false
        registry_nginx['proxy_set_headers'] = { "X-Forwarded-Proto" => "https", "X-Forwarded-Ssl" => "on" }

        gitlab_rails['omniauth_enabled'] = true
        gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
        gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
        gitlab_rails['omniauth_block_auto_created_users'] = false
        gitlab_rails['omniauth_providers'] = [
          {
            name: "openid_connect",
            label: "Authentik",
            args: {
              name: "openid_connect",
              debug: true,
              scope: ["openid", "profile", "email"],
              response_type: "code",
              issuer: "${AUTHENTIK_ISSUER}",
              discovery: true,
              client_auth_method: "query",
              uid_field: "preferred_username",
              client_options: {
                identifier: "${AUTHENTIK_CLIENT_ID}",
                secret: "${AUTHENTIK_CLIENT_SECRET}",
                redirect_uri: "${GITLAB_EXTERNAL_URL}/users/auth/openid_connect/callback"
              }
            }
          }
        ]
    ports:
      - "${GITLAB_HTTP_PORT}:80"
      - "${GITLAB_SSH_PORT}:22"
      - "${GITLAB_REGISTRY_PORT:?GITLAB_REGISTRY_PORT is not set}:5050"
    volumes:
      - ${GITLAB_DATA_DIR}/config:/etc/gitlab
      - ${GITLAB_DATA_DIR}/data:/var/opt/gitlab
      - ${GITLAB_DATA_DIR}/logs:/var/log/gitlab
